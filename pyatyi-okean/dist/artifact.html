<title>Пятый океан</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* src/ui/base.css */
/* Пятый океан — единый визуальный мир игры (одна тёмная тема, намеренно).
   Раскладка: холст на весь экран, поверх него слой #ui с учётом безопасных зон телефона. */
:root {
  color-scheme: dark;
  /* палитра: ночное небо, тёплый горизонт, приборная кремовая шкала */
  --night: #0b1626;        /* глубокий фон панелей */
  --night-2: #13243a;      /* приподнятая поверхность */
  --night-3: #1d3552;      /* границы, неактивные элементы */
  --haze: #8fb4cc;         /* вторичный текст, небесная дымка */
  --cream: #f4ecd8;        /* основной текст, шкалы приборов */
  --dawn: #ff9a3d;         /* акцент: рассветный оранжевый */
  --dawn-2: #ffc56b;       /* светлый акцент */
  --signal: #ef4f3f;       /* опасность, противник */
  --ok: #6fd08c;           /* норма, шасси выпущено */
  --sky: #57b6d9;          /* информация, союзники, маршрут */
  --glass: rgba(11, 22, 38, 0.62);     /* стекло панелей поверх 3D */
  --glass-line: rgba(244, 236, 216, 0.16);
  /* шрифты */
  --f-display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Golos Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  /* безопасные зоны */
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: max(16px, env(safe-area-inset-left, 0px));
  --sa-r: max(16px, env(safe-area-inset-right, 0px));
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui {
  position: absolute; inset: 0;
  pointer-events: none;            /* слои сами включают pointer-events там, где нужно */
  touch-action: none;
  font-variant-numeric: tabular-nums;
}
#ui > * { position: absolute; inset: 0; pointer-events: none; }
#ui button { font: inherit; color: inherit; touch-action: manipulation; }
#ui button:focus-visible { outline: 2px solid var(--dawn-2); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  #ui * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* src/ui/hud.css */
/* HUD полёта. Единица --u = 1px × масштаб интерфейса (--hs ставит ui/hud.js). */
:root {
  --hud-ball-sky: #3f8fc0;        /* авиагоризонт: небо */
  --hud-ball-sky-2: #9ccbe2;
  --hud-ball-earth: #94623a;      /* авиагоризонт: земля */
  --hud-ball-earth-2: #5d3b22;
  --hud-dim: rgba(244, 236, 216, 0.6);     /* второстепенные деления шкал */
  --hud-panel: rgba(11, 22, 38, 0.78);     /* плотное стекло под текстом */
  --hud-shadow: rgba(0, 0, 0, 0.75);       /* тень текста поверх 3D */
}
.hud {
  --hs: 1; --u: calc(var(--hs) * 1px);
  font-family: var(--f-display); color: var(--cream); direction: ltr;
}
.hud.hud-lefty { direction: rtl; }
.hud[hidden], .hud [hidden], .hud-photo[hidden] { display: none !important; }
.hud-top, .hud-dash, .hud-warn, .hud-toasts, .hud-land, .hud-markers, .hud-colli, .hud-ts { direction: ltr; }
.hud canvas { display: block; direction: ltr; }
.hud-camfade { background: var(--night); opacity: 0; }

/* ---------- верх: курс, цель, радио ---------- */
.hud-top {
  position: absolute; top: calc(var(--sa-t) + 8 * var(--u)); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: calc(4 * var(--u));
  width: calc(330 * var(--u)); max-width: 92vw;
}
.hud-obj {
  display: flex; align-items: baseline; gap: calc(7 * var(--u)); max-width: 100%; box-sizing: border-box;
  padding: calc(3 * var(--u)) calc(11 * var(--u)) calc(4 * var(--u));
  background: var(--hud-panel); border: 1px solid var(--glass-line); border-left: calc(3 * var(--u)) solid var(--dawn);
  border-radius: calc(7 * var(--u));
  font-family: var(--f-body); font-size: calc(12 * var(--u)); font-weight: 500; line-height: 1.25;
}
.hud-obj b { font-family: var(--f-mono); font-size: calc(10 * var(--u)); color: var(--dawn-2); font-weight: 600; white-space: nowrap; }
.hud-obj.is-new { animation: hud-flash 1.2s ease-out; }
.hud-radio {
  max-width: 100%; box-sizing: border-box; padding: calc(3 * var(--u)) calc(10 * var(--u)) calc(4 * var(--u));
  background: var(--hud-panel); border-radius: calc(7 * var(--u));
  font-family: var(--f-body); font-size: calc(12 * var(--u)); line-height: 1.3; text-align: center;
}
.hud-radio b { font-family: var(--f-display); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sky); margin-right: calc(6 * var(--u)); font-size: calc(11 * var(--u)); }
.hud-radio b::after { content: ':'; }
.hud-radio.is-new { animation: hud-rise 0.25s ease-out; }

/* ---------- угол: мини-карта ---------- */
.hud-corner { position: absolute; top: calc(var(--sa-t) + 8 * var(--u)); inset-inline-start: var(--sa-l); display: flex; align-items: flex-start; gap: calc(6 * var(--u)); }
.hud-radar { border-radius: 50%; box-shadow: 0 calc(2 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.35); }
.hud-ts { font-family: var(--f-mono); font-size: calc(11 * var(--u)); font-weight: 600; color: var(--night); background: var(--dawn); border-radius: calc(5 * var(--u)); padding: calc(2 * var(--u)) calc(7 * var(--u)); white-space: nowrap; }

/* ---------- предупреждения, сообщения ---------- */
.hud-warn {
  position: absolute; top: 29%; left: 50%; transform: translateX(-50%); white-space: nowrap;
  padding: calc(4 * var(--u)) calc(14 * var(--u)); border-radius: calc(6 * var(--u));
  background: var(--hud-panel); border: 1.5px solid var(--dawn); color: var(--dawn-2);
  font-size: calc(15 * var(--u)); font-weight: 600; letter-spacing: 0.16em;
  animation: hud-blink 0.9s steps(1) infinite;
}
.hud-warn.is-crit { border-color: var(--signal); color: var(--cream); background: var(--signal); font-size: calc(17 * var(--u)); animation-duration: 0.5s; }
.hud-toasts {
  position: absolute; left: 50%; bottom: calc(var(--sa-b) + 146 * var(--u)); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: calc(4 * var(--u)); width: calc(330 * var(--u)); max-width: 92vw;
}
.hud-toast {
  padding: calc(3 * var(--u)) calc(11 * var(--u)) calc(4 * var(--u)); border-radius: calc(12 * var(--u));
  background: var(--hud-panel); border: 1px solid var(--glass-line);
  font-family: var(--f-body); font-size: calc(11.5 * var(--u)); font-weight: 500; text-align: center; line-height: 1.25;
  animation: hud-rise 0.22s ease-out; transition: opacity 0.35s;
}
.hud-toast.is-out { opacity: 0; }
.hud-toast-good { border-color: var(--ok); color: var(--ok); }
.hud-toast-warn { border-color: var(--dawn); color: var(--dawn-2); }
.hud-toast-bad { border-color: var(--signal); color: var(--cream); background: var(--signal); }

/* ---------- доска ---------- */
.hud-dash {
  position: absolute; left: 50%; bottom: calc(var(--sa-b) + 6 * var(--u)); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: calc(3 * var(--u));
}
.hud-strip {
  display: flex; align-items: center; gap: calc(7 * var(--u)); min-width: calc(300 * var(--u)); width: max-content; box-sizing: border-box;
  padding: calc(2 * var(--u)) calc(8 * var(--u)); border-radius: calc(7 * var(--u));
  background: var(--hud-panel); border: 1px solid var(--glass-line);
  font-size: calc(9.5 * var(--u)); letter-spacing: 0.08em; line-height: 1.35; white-space: nowrap;
}
.hud-s { color: var(--hud-dim); }
.hud-s-gap { flex: 1; }
.hud-s-thr, .hud-s-g, .hud-s-fuel, .hud-s-hp { font-family: var(--f-mono); font-size: calc(9 * var(--u)); letter-spacing: 0; color: var(--cream); }
.hud-s-gear::before, .hud-s-brk::before { content: ''; display: inline-block; width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 50%; margin-right: calc(3 * var(--u)); background: var(--night-3); box-shadow: inset 0 0 0 1px var(--hud-dim); }
.hud-s-gear.is-ok { color: var(--ok); }
.hud-s-gear.is-ok::before { background: var(--ok); box-shadow: none; }
.hud-s-gear.is-move { color: var(--dawn-2); }
.hud-s-gear.is-move::before { background: var(--dawn); box-shadow: none; animation: hud-blink 0.5s steps(1) infinite; }
.hud-s-flaps.is-on, .hud-s-brk.is-on { color: var(--dawn-2); }
.hud-s-brk.is-on::before { background: var(--dawn); box-shadow: none; }
.hud-s.is-warn { color: var(--signal); }
.hud-ils {
  padding: calc(2 * var(--u)) calc(10 * var(--u)); border-radius: calc(10 * var(--u));
  background: var(--hud-panel); border: 1px solid var(--dawn); color: var(--dawn-2);
  font-family: var(--f-mono); font-size: calc(10 * var(--u)); font-weight: 600; white-space: nowrap;
}
.hud-ils.is-ok { border-color: var(--ok); color: var(--ok); }

/* ---------- оценка посадки ---------- */
.hud-land {
  position: absolute; left: 50%; top: 17%; transform: translateX(-50%); width: calc(310 * var(--u)); max-width: 90vw; box-sizing: border-box;
  padding: calc(8 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u)); border-radius: calc(12 * var(--u));
  background: var(--hud-panel); border: 1px solid var(--glass-line); border-top: calc(3 * var(--u)) solid var(--ok);
  animation: hud-rise 0.3s ease-out;
}
.hud-land-warn { border-top-color: var(--dawn); }
.hud-land-bad { border-top-color: var(--signal); }
.hud-land-t { font-size: calc(18 * var(--u)); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-bottom: calc(5 * var(--u)); }
.hud-land-row { display: grid; grid-template-columns: 1fr auto calc(104 * var(--u)); white-space: nowrap; gap: calc(8 * var(--u)); align-items: baseline; font-family: var(--f-body); font-size: calc(11 * var(--u)); line-height: 1.55; color: var(--haze); }
.hud-land-row b { font-family: var(--f-mono); color: var(--cream); font-weight: 600; }
.hud-land-row i { font-style: normal; font-weight: 600; color: var(--ok); }
.hud-land-row.is-warn i { color: var(--dawn-2); }
.hud-land-row.is-bad i { color: var(--signal); }

/* ---------- маркеры в мире ---------- */
.hud-markers { position: absolute; inset: 0; overflow: hidden; }
.hud-mk { --mk: var(--dawn); position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.hud-mk-target, .hud-mk-bandit { --mk: var(--signal); }
.hud-mk-friend { --mk: var(--sky); }
.hud-mk-airport { --mk: var(--cream); }
.hud-mk-ico { position: absolute; left: calc(-12 * var(--u)); top: calc(-12 * var(--u)); width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
.hud-mk-ico::before { content: ''; position: absolute; inset: calc(3 * var(--u)); box-sizing: border-box; border: 2px solid var(--mk); filter: drop-shadow(0 1px 2px var(--hud-shadow)); }
.hud-mk-waypoint .hud-mk-ico::before { transform: rotate(45deg); }
.hud-mk-target .hud-mk-ico::before { background: radial-gradient(circle, var(--mk) 0 2px, transparent 2.5px); }
.hud-mk-friend .hud-mk-ico::before { border-radius: 50%; }
.hud-mk-airport .hud-mk-ico::before { inset: calc(1 * var(--u)) calc(7 * var(--u)); border-radius: calc(2 * var(--u)); background: linear-gradient(var(--mk), var(--mk)) center / 1.5px 60% no-repeat; }
.hud-mk-ring .hud-mk-ico::before { inset: 0; border-radius: 50%; border-width: 1.5px; }
.hud-mk-bandit .hud-mk-ico::before { inset: calc(5 * var(--u)); border-width: 1.5px; }
.hud-mk.is-off .hud-mk-ico::before { inset: calc(2 * var(--u)); border: 0; border-radius: 0; transform: none; background: var(--mk); clip-path: polygon(100% 50%, 28% 10%, 44% 50%, 28% 90%); }
.hud-mk-txt { position: absolute; left: 0; top: calc(13 * var(--u)); transform: translateX(-50%); text-align: center; white-space: nowrap; line-height: 1.15; text-shadow: 0 1px 3px var(--hud-shadow), 0 0 2px var(--hud-shadow); }
.hud-mk-txt b { display: block; font-family: var(--f-body); font-weight: 600; font-size: calc(10.5 * var(--u)); color: var(--cream); }
.hud-mk-txt i { font-family: var(--f-mono); font-style: normal; font-weight: 600; font-size: calc(9.5 * var(--u)); color: var(--mk); }
.hud-mk-bandit .hud-mk-txt { top: calc(9 * var(--u)); }

/* ---------- прицельные марки ---------- */
.hud-aim { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.hud-aim::before { content: ''; position: absolute; box-sizing: border-box; filter: drop-shadow(0 1px 2px var(--hud-shadow)); }
.hud-aim-bore::before { left: calc(-10 * var(--u)); top: calc(-10 * var(--u)); width: calc(20 * var(--u)); height: calc(20 * var(--u)); border-radius: 50%; border: 1.5px solid var(--ok);
  background: radial-gradient(circle, var(--ok) 0 1.5px, transparent 2px); }
.hud-aim-lead::before { left: calc(-6 * var(--u)); top: calc(-6 * var(--u)); width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; border: 2px solid var(--dawn-2); }
.hud-aim-lock { --p: 0; }
.hud-aim-lock::before { left: calc(-24 * var(--u)); top: calc(-24 * var(--u)); width: calc(48 * var(--u)); height: calc(48 * var(--u)); border-radius: 50%; border: 2px dashed var(--signal); transform: scale(calc(1.9 - 0.9 * var(--p))); }
.hud-aim-lock.is-locked::before { border-style: solid; }
.hud-aim-lock span { position: absolute; left: 0; top: calc(27 * var(--u)); transform: translateX(-50%); font-size: calc(10 * var(--u)); font-weight: 600; letter-spacing: 0.14em; color: var(--signal); text-shadow: 0 1px 3px var(--hud-shadow); }
.hud-aim-fpm::before { left: calc(-5 * var(--u)); top: calc(-5 * var(--u)); width: calc(10 * var(--u)); height: calc(10 * var(--u)); border-radius: 50%; border: 1.5px solid var(--ok); box-shadow: calc(-11 * var(--u)) 0 0 calc(-4 * var(--u)) var(--ok), calc(11 * var(--u)) 0 0 calc(-4 * var(--u)) var(--ok); }

/* ---------- коллиматор вида из кабины ---------- */
.hud-colli { position: absolute; inset: 0; --ppd: 6; color: var(--ok); }
.hud-colli-clip { position: absolute; left: 50%; top: 50%; width: calc(230 * var(--u)); height: calc(170 * var(--u)); margin: calc(-85 * var(--u)) 0 0 calc(-115 * var(--u)); overflow: hidden;
  -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent); mask-image: radial-gradient(closest-side, #000 72%, transparent); }
.hud-colli-ladder { position: absolute; left: 50%; top: 50%; width: 0; height: 0; will-change: transform; }
.hud-colli-ln { position: absolute; left: calc(-15 * var(--u)); width: calc(30 * var(--u)); height: 0; top: calc(var(--d) * var(--ppd) * -1px); border-top: 1.5px solid var(--ok); opacity: 0.75;
  display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: calc(8.5 * var(--u)); line-height: 0; filter: drop-shadow(0 1px 1px var(--hud-shadow)); }
.hud-colli-ln.is-major { left: calc(-34 * var(--u)); width: calc(68 * var(--u)); opacity: 1; }
.hud-colli-ln.is-hor { left: calc(-105 * var(--u)); width: calc(210 * var(--u)); opacity: 1; }
.hud-colli-ln.is-neg { border-top-style: dashed; }
.hud-colli-ln span:first-child { margin-left: calc(-16 * var(--u)); }
.hud-colli-ln span:last-child { margin-right: calc(-16 * var(--u)); }
.hud-colli-cross { position: absolute; left: 50%; top: 50%; width: calc(44 * var(--u)); height: calc(10 * var(--u)); margin: calc(-1 * var(--u)) 0 0 calc(-22 * var(--u));
  background: linear-gradient(var(--ok), var(--ok)) left top / 36% 1.5px no-repeat, linear-gradient(var(--ok), var(--ok)) right top / 36% 1.5px no-repeat, radial-gradient(circle at 50% 1px, var(--ok) 0 2px, transparent 2.5px);
  filter: drop-shadow(0 1px 1px var(--hud-shadow)); }

/* ---------- фоторежим ---------- */
.hud-photo { --hs: 1; --u: calc(var(--hs) * 1px); }
.hud-photo-exit {
  position: absolute; top: calc(var(--sa-t) + 10 * var(--u)); right: var(--sa-r); min-width: 88px; min-height: 44px; padding: 0 calc(18 * var(--u));
  border-radius: calc(22 * var(--u)); border: 1px solid var(--dawn-2); background: var(--dawn); color: var(--night) !important;
  font-family: var(--f-display) !important; font-size: calc(14 * var(--u)) !important; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  pointer-events: auto; cursor: pointer;
}
.hud-photo-tip { position: absolute; left: 50%; bottom: calc(var(--sa-b) + 12 * var(--u)); transform: translateX(-50%); padding: calc(3 * var(--u)) calc(12 * var(--u)); border-radius: calc(12 * var(--u)); background: var(--hud-panel); font-family: var(--f-body); font-size: calc(11.5 * var(--u)); color: var(--haze); white-space: nowrap; }

@keyframes hud-blink { 50% { opacity: 0.35; } }
@keyframes hud-rise { from { opacity: 0; translate: 0 calc(6 * var(--u)); } }
@keyframes hud-flash { 0%, 30% { border-color: var(--dawn-2); box-shadow: 0 0 0 calc(3 * var(--u)) rgba(255, 154, 61, 0.4); } }

/* ---------- портрет: доска поднимается над органами управления ---------- */
@media (orientation: portrait) {
  .hud-dash { bottom: calc(var(--sa-b) + 32%); }
  .hud-toasts { bottom: auto; top: 37%; }
  .hud-top { top: calc(var(--sa-t) + 110 * var(--u)); }
  .hud-warn { top: 31%; }
  .hud-land { top: 22%; }
}

/* src/ui/map.css */
/* Полная карта архипелага (ui/map.js). Открывается поверх всего, закрывается тапом. */
:root { --map-veil: rgba(11, 22, 38, 0.86); }
.map { z-index: 30; pointer-events: auto !important; touch-action: none; background: var(--map-veil); color: var(--cream); cursor: pointer; }
.map[hidden] { display: none !important; }
.map-frame {
  position: absolute; inset: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 16px;
  padding: calc(var(--sa-t) + 10px) var(--sa-r) calc(var(--sa-b) + 10px) var(--sa-l);
}
.map-chart { height: 100%; aspect-ratio: 1; max-width: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; }
.map-canvas { display: block; border-radius: 10px; border: 1px solid var(--glass-line); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
.map-side { flex: 0 1 230px; min-width: 150px; display: flex; flex-direction: column; gap: 6px; }
.map-title { font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.15; }
.map-sub { font-size: 11px; color: var(--haze); margin-bottom: 4px; }
.map-row { display: grid; grid-template-columns: 1fr auto 62px; gap: 8px; align-items: baseline; font-size: 12px; line-height: 1.7; border-bottom: 1px solid var(--glass-line); }
.map-row b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-row span { font-family: var(--f-mono); font-size: 11px; color: var(--dawn-2); text-align: right; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; color: var(--haze); margin-top: 4px; }
.map-legend span { display: flex; align-items: center; gap: 5px; }
.map-lg { width: 9px; height: 9px; display: inline-block; box-sizing: border-box; }
.map-lg-me { background: var(--dawn); clip-path: polygon(50% 0, 100% 100%, 50% 72%, 0 100%); }
.map-lg-obj { border: 2px solid var(--dawn); border-radius: 50%; }
.map-lg-apt { background: var(--cream); height: 3px; }
.map-lg-poi { background: var(--haze); transform: rotate(45deg) scale(0.75); }
.map-close { margin-top: 8px; font-family: var(--f-display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dawn-2); }
@media (orientation: portrait) {

.menu-deb { position: absolute; inset: 0; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 410px); grid-template-rows: minmax(0, 1fr) auto; gap: 10px 20px;

.menu-hangar-panel { flex: none; width: min(348px, 43vw); }

.menu-book-sub:first-child { margin-top: 0; }
.menu-book-sub b { font-family: var(--f-mono); font-weight: 400; letter-spacing: 0; color: var(--haze); }
.menu-type { display: grid; grid-template-columns: 76px minmax(40px, 1fr) 92px 128px; align-items: center; gap: 12px; min-height: 30px; border-bottom: 1px dotted var(--menu-cream-faint); }
.menu-type > span:first-child { font-weight: 600; font-size: 13px; }
.menu-type b { font-family: var(--f-mono); font-size: 12px; font-weight: 400; text-align: right; }
.menu-type i { font-size: 11.5px; color: var(--haze); text-align: right; white-space: nowrap; }

.menu-journal-row { display: grid; grid-template-columns: 44px 62px minmax(0, 1fr) 52px 118px 62px; align-items: center; gap: 10px; min-height: 42px; border-bottom: 1px dotted var(--menu-cream-faint); font-size: 12.5px; }
.menu-journal-row > span { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-journal-row > span:nth-child(2) { font-family: var(--f-body); font-weight: 600; }
.menu-journal-row > span:nth-child(5) { font-family: var(--f-body); color: var(--menu-cream-dim); }
.menu-journal-row > span:last-child { text-align: right; color: var(--dawn-2); }
.menu-journal-row > span.menu-bad { color: var(--signal); }
.menu-journal-row .menu-journal-what { font-family: var(--f-body); font-size: 13px; line-height: 1.2; white-space: normal; }
.menu-journal-what .menu-stars { margin-left: 6px; }
.menu-journal-what i { display: block; font-size: 11px; color: var(--haze); }
.menu-journal-row.is-head { min-height: 26px; border-bottom: 1px solid var(--menu-cream-dim); }
.menu-journal-row.is-head > span { font-family: var(--f-display); font-size: 10px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: var(--haze); }
.menu-journal-row.is-bad .menu-journal-what i { color: var(--signal); }

.menu-awards { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 18px; align-items: start; }
.menu-award-info { position: sticky; top: 0; }
.menu-award-info h3 { font-family: var(--f-display); font-size: 21px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.12; margin: 6px 0 4px; }
.menu-award-info p { font-size: 13px; color: var(--menu-cream-dim); }
.menu-award-meta { display: grid; gap: 5px; margin-top: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--haze); }
.menu-award-meta b { font-weight: 400; color: var(--dawn-2); }
.menu-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px 4px; }
#ui .menu-badge { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 92px; padding: 6px 2px 4px; border-radius: 3px; color: var(--menu-cream-dim); text-align: center; }
.menu-badge-ring { width: 48px; height: 48px; flex: none; }
.menu-badge-ring circle { fill: none; stroke: var(--menu-cream-faint); stroke-width: 2; }
.menu-badge-ring circle.is-arc { stroke: var(--cream); stroke-linecap: butt; }
.menu-badge > .menu-ico { position: absolute; top: 19px; left: 50%; margin-left: -11px; opacity: 0.6; }
.menu-badge > span { font-size: 10.5px; line-height: 1.15; }
#ui .menu-badge.is-got { color: var(--cream); }
.menu-badge.is-got .menu-badge-ring circle { fill: var(--menu-dawn-soft); stroke: var(--dawn); }
.menu-badge.is-got > .menu-ico { opacity: 1; color: var(--dawn-2); }
#ui .menu-badge.is-on { background: var(--menu-raised); }

.menu-places { display: grid; grid-template-columns: minmax(180px, 46%) minmax(0, 1fr); gap: 18px; align-items: start; }
.menu-places-map { position: sticky; top: 0; }
.menu-places-list ul { columns: 2; column-gap: 16px; margin-bottom: 4px; }
.menu-places-list li { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--menu-cream-dim); break-inside: avoid; }
.menu-places-list li i { display: none; }
.menu-places-list li.is-on { color: var(--cream); }
.menu-places-list li.is-on .menu-ico { color: var(--ok); }

/* ---------- настройки ---------- */
.menu-settings-panel, .menu-controls-panel { flex: 1; max-width: 760px; }
.menu-settings-scroll, .menu-controls-scroll { flex: 1; min-height: 0; padding: 12px 16px; }
.menu-set { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; padding: 2px 0; border-bottom: 1px dotted var(--menu-cream-faint); }
.menu-set-name { font-size: 14px; min-width: 0; }
.menu-set-name i { display: block; font-size: 11.5px; color: var(--haze); }
.menu-set-ctl { display: inline-flex; align-items: center; gap: 10px; flex: none; max-width: 62%; }
.menu-set-ctl b { min-width: 44px; font-family: var(--f-mono); font-size: 12.5px; font-weight: 400; text-align: right; }
.menu-range { -webkit-appearance: none; appearance: none; width: clamp(120px, 24vw, 220px); height: 44px; margin: 0; background: transparent; }
.menu-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--menu-cream-faint); }
.menu-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--menu-cream-faint); }
.menu-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border: 2px solid var(--night); border-radius: 50%; background: var(--cream); }
.menu-range::-moz-range-thumb { width: 20px; height: 20px; border: 2px solid var(--night); border-radius: 50%; background: var(--cream); }
.menu-range:focus-visible { outline: 2px solid var(--dawn-2); outline-offset: 2px; }
#ui .menu-switch { position: relative; width: 56px; height: 44px; }
.menu-switch::before { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 24px; border: 1px solid var(--menu-cream-dim); border-radius: 12px; background: var(--menu-raised); transition: background 0.15s; }
.menu-switch i { position: absolute; left: 8px; top: 14px; width: 16px; height: 16px; border-radius: 50%; background: var(--menu-cream-dim); transition: transform 0.15s, background 0.15s; }
.menu-switch.is-on::before { background: var(--menu-dawn-soft); border-color: var(--dawn); }
.menu-switch.is-on i { transform: translateX(24px); background: var(--dawn); }
.menu-input { box-sizing: border-box; width: clamp(140px, 26vw, 230px); height: 44px; padding: 0 12px; border: 1px solid var(--glass-line); border-radius: 3px; background: var(--menu-raised); color: var(--cream); font: inherit; -webkit-user-select: text; user-select: text; }
.menu-input:focus { outline: 2px solid var(--dawn-2); outline-offset: 1px; }

.menu-controls-cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; }
.menu-keys > div { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--menu-cream-faint); font-size: 12.5px; }
.menu-keys dt { font-weight: 600; }
.menu-keys dd { color: var(--menu-cream-dim); }
.menu-keys--kbd dt { font-family: var(--f-mono); font-size: 11.5px; font-weight: 400; color: var(--dawn-2); }
.menu-tips li { position: relative; padding: 5px 0 5px 16px; font-size: 13px; color: var(--menu-cream-dim); }
.menu-tips li::before { content: ""; position: absolute; left: 2px; top: 12px; width: 6px; height: 2px; background: var(--dawn); }

@media (orientation: portrait) {
  .menu-free-map { width: min(100%, 40vh); align-self: center; }
  .menu-figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .menu-fig:nth-child(3) { border-left: 0; padding-left: 0; }
  .menu-book-lines { columns: 1; }
  .menu-awards, .menu-places, .menu-controls-cols { grid-template-columns: minmax(0, 1fr); }
  .menu-award-info, .menu-places-map { position: static; }
  .menu-type { grid-template-columns: 64px minmax(30px, 1fr) 84px; }
  .menu-type i { display: none; }
  .menu-journal-row { grid-template-columns: 40px minmax(0, 1fr) 48px 56px; }
  .menu-journal-row > span:nth-child(2), .menu-journal-row > span:nth-child(5) { display: none; }
  .menu-set { flex-wrap: wrap; }
  .menu-set-ctl { max-width: 100%; }
}

/* src/ui/menu.css */
/* МЕНЮ — оболочка, общие элементы и главный экран.
   Правило специфичности: base.css задаёт `#ui button { font: inherit; color: inherit }`,
   поэтому шрифт и цвет кнопок меню задаются селекторами с #ui. */
:root {
  --menu-glass: rgba(11, 22, 38, 0.76);        /* стекло под текстом: плотнее, чем --glass */
  --menu-glass-soft: rgba(11, 22, 38, 0.46);
  --menu-raised: rgba(29, 53, 82, 0.66);       /* кнопка на стекле */
  --menu-cream-dim: rgba(244, 236, 216, 0.66); /* вторичный текст на стекле */
  --menu-cream-faint: rgba(244, 236, 216, 0.2);/* пустая шкала, неполученное */
  --menu-dawn-soft: rgba(255, 154, 61, 0.16);
  --menu-signal-soft: rgba(239, 79, 63, 0.16);
  --menu-ok-soft: rgba(111, 208, 140, 0.16);
  --menu-ink: rgba(11, 22, 38, 0.72);          /* тень под текстом поверх 3D */
  --menu-scrim-0: rgba(11, 22, 38, 0);
  --menu-scrim-1: rgba(11, 22, 38, 0.34);
  --menu-scrim-2: rgba(11, 22, 38, 0.62);
  --menu-scrim-3: rgba(11, 22, 38, 0.9);
  --menu-bar-h: 52px;
}

.menu { color: var(--cream); font-family: var(--f-body); font-size: 14px; line-height: 1.35; }
.menu-stage { position: absolute; inset: 0; }
:where(.menu) :where(h1, h2, h3, h4, p, dl, dd, ul) { margin: 0; padding: 0; }
:where(.menu) ul { list-style: none; }
:where(.menu) button { background: none; border: 0; padding: 0; margin: 0; border-radius: 0; text-align: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
.menu em, .menu i { font-style: normal; }

/* ---------- экран и переходы ---------- */
.menu-screen { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: auto; }
.menu-screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, var(--menu-scrim-3) 0, var(--menu-scrim-2) 64px, var(--menu-scrim-1) 150px, var(--menu-scrim-1) 100%); }
.menu-in-fwd { animation: menu-in-fwd 0.24s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.menu-in-back { animation: menu-in-back 0.24s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.menu-screen.is-leaving { animation: menu-out 0.15s ease-in both; }
@keyframes menu-in-fwd { from { opacity: 0; transform: translateX(16px); } }
@keyframes menu-in-back { from { opacity: 0; transform: translateX(-16px); } }
@keyframes menu-out { to { opacity: 0; } }
.menu-fail { margin: auto; text-align: center; display: grid; gap: 12px; }

/* ---------- значки, звёзды, шкалы ---------- */
.menu-ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu-ico-fill { fill: currentColor; stroke: none; }
.menu-stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.menu-star { color: var(--menu-cream-faint); }
.menu-star.is-on { color: var(--dawn-2); }
.menu-pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.menu-pips i { width: 5px; height: 11px; background: var(--menu-cream-faint); transform: skewX(-16deg); }
.menu-pips i.is-on { background: var(--cream); }
.menu-scale { position: relative; display: block; flex: 1; min-width: 36px; height: 5px; background: var(--menu-cream-faint); overflow: hidden; }
.menu-scale > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cream); transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.menu-scale > b { position: absolute; top: 0; bottom: 0; background: var(--dawn); }
/* шкала-линейка с делениями, как на приборе */
.menu-scale--ticks { height: 11px; background: repeating-linear-gradient(90deg, var(--menu-cream-dim) 0, var(--menu-cream-dim) 1px, transparent 1px, transparent 10%); border-bottom: 1px solid var(--menu-cream-dim); border-right: 1px solid var(--menu-cream-dim); }
.menu-scale--ticks > i { top: auto; height: 5px; background: var(--dawn); }

.menu-label { font-family: var(--f-display); font-size: 11px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; color: var(--haze); }
.menu-note { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--menu-cream-dim); }
.menu-note.is-warn { color: var(--dawn-2); }
.menu-note.is-ok, .menu-ok { color: var(--ok); }
.menu-bad { color: var(--signal); }
.menu-empty { padding: 18px 4px; color: var(--menu-cream-dim); }
.menu-tag { display: inline-block; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--dawn); color: var(--dawn-2); font-family: var(--f-display); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; vertical-align: 2px; white-space: nowrap; }

/* штамп допуска */
.menu-stamp { display: inline-block; padding: 3px 10px 2px 12px; border: 2px solid var(--dawn); outline: 1px solid var(--dawn); outline-offset: 2px; color: var(--dawn); font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; transform: rotate(-4deg); }
.menu-stamp--small { font-size: 11px; padding: 2px 7px 1px 9px; border-width: 1px; outline: 0; }

/* бортовая табличка с заклёпками */
.menu-plate { position: relative; display: block; padding: 10px 16px 11px; background: var(--menu-glass); border: 1px solid var(--menu-cream-faint); border-radius: 3px;
  background-image: radial-gradient(circle at 6px 6px, var(--menu-cream-dim) 1.2px, transparent 1.8px), radial-gradient(circle at calc(100% - 6px) 6px, var(--menu-cream-dim) 1.2px, transparent 1.8px),
    radial-gradient(circle at 6px calc(100% - 6px), var(--menu-cream-dim) 1.2px, transparent 1.8px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), var(--menu-cream-dim) 1.2px, transparent 1.8px); }

.menu-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--menu-glass); border: 1px solid var(--glass-line); border-radius: 3px; }
.menu-scroll { overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--menu-cream-faint) transparent; }
.menu-scroll-x { overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior: contain; scrollbar-width: none; }
.menu-scroll-x::-webkit-scrollbar { display: none; }

/* ---------- кнопки ---------- */
#ui .menu-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid var(--glass-line); border-radius: 3px; background: var(--menu-raised);
  color: var(--cream); font-family: var(--f-display); font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; transition: transform 0.08s, filter 0.15s; }
#ui .menu-btn:active { transform: translateY(1px) scale(0.985); filter: brightness(1.15); }
#ui .menu-btn--primary { background: var(--dawn); border-color: var(--dawn); color: var(--night); font-weight: 600; }
#ui .menu-btn--danger { border-color: var(--signal); color: var(--signal); background: var(--menu-signal-soft); }
#ui .menu-btn--small { padding: 0 12px; font-size: 12px; }
#ui .menu-btn--wide { min-width: 170px; }
#ui .menu-btn.is-off { opacity: 0.42; }
#ui .menu-icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--glass-line); border-radius: 3px; background: var(--menu-glass-soft); color: var(--cream); }

#ui .menu-chip { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 44px; padding: 0 12px; border: 1px solid var(--glass-line); border-radius: 3px; background: var(--menu-raised); color: var(--cream); font-size: 13px; white-space: nowrap; }
#ui .menu-chip.is-on { border-color: var(--dawn); background: var(--menu-dawn-soft); color: var(--dawn-2); }
.menu-chip.is-static { cursor: default; }
.menu-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.menu-chips.menu-scroll-x { flex-wrap: nowrap; }

.menu-seg { display: inline-flex; max-width: 100%; border: 1px solid var(--glass-line); border-radius: 3px; background: var(--menu-raised); overflow: hidden; }
#ui .menu-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 auto; min-height: 42px; padding: 0 13px; color: var(--menu-cream-dim); font-family: var(--f-display); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
#ui .menu-seg button + button { border-left: 1px solid var(--glass-line); }
#ui .menu-seg button.is-on { background: var(--cream); color: var(--night); font-weight: 600; }

/* ---------- шапка внутренних экранов ---------- */
.menu-bar { display: flex; align-items: center; gap: 10px; flex: none; box-sizing: content-box; height: var(--menu-bar-h); padding: var(--sa-t) var(--sa-r) 0 calc(var(--sa-l) - 10px); }
#ui .menu-bar-back { display: inline-flex; align-items: center; gap: 2px; min-width: 44px; height: 44px; padding: 0 10px 0 4px; color: var(--cream); font-family: var(--f-display); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
.menu-bar-title { font-family: var(--f-display); font-size: 20px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; padding-left: 12px; border-left: 1px solid var(--menu-cream-faint); }
.menu-bar-mid { flex: 1; min-width: 0; display: flex; justify-content: center; }
.menu-bar-wallet { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; }
.menu-bar-rank { font-family: var(--f-display); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--haze); white-space: nowrap; }
.menu-bar-money { font-family: var(--f-mono); font-size: 15px; color: var(--dawn-2); white-space: nowrap; }
.menu-body { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px var(--sa-r) calc(var(--sa-b) + 12px) var(--sa-l); }

/* вертикальные вкладки */
.menu-rail { display: flex; flex-direction: column; gap: 2px; flex: none; width: 176px; }
#ui .menu-rail-tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; min-height: 44px; padding: 0 10px 0 12px; border-left: 2px solid var(--menu-cream-faint); background: linear-gradient(90deg, var(--menu-glass-soft), var(--menu-scrim-0));
  color: var(--menu-cream-dim); font-family: var(--f-display); font-size: 13.5px; letter-spacing: 0.1em; text-transform: uppercase; }
#ui .menu-rail-tab b { font-family: var(--f-mono); font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--haze); }
#ui .menu-rail-tab.is-on { border-left-color: var(--dawn); background: linear-gradient(90deg, var(--menu-glass), var(--menu-glass-soft)); color: var(--cream); }

/* ---------- карта архипелага ---------- */
.menu-map { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--menu-glass); border: 1px solid var(--glass-line); border-radius: 3px; }
.menu-map-img, .menu-map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.menu-map-grid { fill: none; stroke: var(--menu-cream-faint); stroke-width: 1px; stroke-dasharray: 1 5; vector-effect: non-scaling-stroke; }
.menu-map-route { fill: none; stroke: var(--dawn); stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
#ui .menu-map-ap, .menu-map-ap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; color: var(--menu-cream-dim); }
.menu-map-ap i { width: 9px; height: 9px; border: 1.5px solid var(--cream); border-radius: 50%; background: var(--night); }
.menu-map-ap.is-visited i { background: var(--cream); }
.menu-map-ap.is-selected i, .menu-map-ap.is-route i { border-color: var(--dawn); background: var(--dawn); box-shadow: 0 0 0 4px var(--menu-dawn-soft); }
.menu-map-ap em { position: absolute; top: 29px; left: 50%; transform: translateX(-50%); font-family: var(--f-display); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 3px var(--night); }
.menu-map-ap.is-left em { left: auto; right: 50%; transform: none; }
#ui .menu-map-ap.is-selected, .menu-map-ap.is-route { color: var(--dawn-2); }
.menu-map-poi { position: absolute; width: 5px; height: 5px; margin: -3px 0 0 -3px; transform: rotate(45deg); border: 1px solid var(--haze); }
.menu-map-poi.is-on { background: var(--sky); border-color: var(--sky); }
.menu-map-n { position: absolute; right: 8px; top: 6px; font-family: var(--f-display); font-size: 10px; letter-spacing: 0.1em; color: var(--haze); }
.menu-map-n::before { content: ""; display: block; margin: 0 auto 1px; width: 0; height: 0; border: 3px solid transparent; border-top: 0; border-bottom: 6px solid var(--haze); }

/* ---------- диалоги, подсказки ---------- */
.menu-overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 12px; background: var(--menu-scrim-2); pointer-events: auto; }
.menu-dialog { box-sizing: border-box; width: min(440px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; padding: 16px 20px; background: var(--night-2); border: 1px solid var(--glass-line); border-top: 2px solid var(--dawn); border-radius: 3px; animation: menu-pop 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
@keyframes menu-pop { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
.menu-dialog-title { font-family: var(--f-display); font-size: 24px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.1; margin: 2px 0 8px; }
.menu-dialog-text { color: var(--menu-cream-dim); font-size: 13.5px; }
.menu-dialog-text b { color: var(--cream); font-weight: 600; }
.menu-dialog-sum { font-family: var(--f-mono); font-size: 28px; color: var(--dawn-2); margin: 2px 0 6px; }
.menu-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.menu-dialog--rank { text-align: center; }
.menu-dialog--rank .menu-dialog-title { font-size: 30px; color: var(--dawn-2); }
.menu-dialog--rank .menu-dialog-actions { justify-content: center; }
.menu-rank-stamp { padding: 8px 0 14px; }
.menu-rank-stamp .menu-stamp { font-size: 17px; animation: menu-stamp 0.45s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes menu-stamp { from { opacity: 0; transform: rotate(-14deg) scale(2.6); } }
.menu-dialog--welcome .menu-dialog-title { font-size: 34px; letter-spacing: 0.16em; }

.menu-toasts { position: absolute; inset: calc(var(--sa-t) + var(--menu-bar-h) + 4px) 0 auto 0; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.menu-toast { max-width: min(520px, calc(100% - 32px)); padding: 9px 14px; background: var(--night-2); border: 1px solid var(--glass-line); border-left: 3px solid var(--sky); border-radius: 3px; font-size: 13px; animation: menu-pop 0.2s both; transition: opacity 0.25s; }
.menu-toast.is-good { border-left-color: var(--ok); }
.menu-toast.is-warn { border-left-color: var(--dawn); }
.menu-toast.is-bad { border-left-color: var(--signal); }
.menu-toast.is-out { opacity: 0; }
.menu-rotate { position: absolute; inset: auto var(--sa-r) calc(var(--sa-b) + 10px) var(--sa-l); z-index: 4; display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px; background: var(--night-2); border: 1px solid var(--glass-line); border-radius: 3px; font-size: 12.5px; color: var(--menu-cream-dim); pointer-events: auto; }
.menu-rotate span { flex: 1; }
#ui .menu-rotate button { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }

/* ---------- главный экран ---------- */
.menu-screen--main::before, .menu-screen--pause::before {
  background: linear-gradient(90deg, var(--menu-scrim-3) 0, var(--menu-scrim-2) 40%, var(--menu-scrim-0) 70%), linear-gradient(0deg, var(--menu-scrim-1), var(--menu-scrim-0) 40%); }
.menu-main { position: absolute; inset: 0; box-sizing: border-box; display: grid; grid-template-columns: minmax(280px, 470px) minmax(0, 1fr) minmax(224px, 280px); grid-template-rows: auto minmax(0, 1fr); column-gap: 16px;
  padding: calc(var(--sa-t) + 14px) var(--sa-r) calc(var(--sa-b) + 12px) calc(var(--sa-l) + 6px); }
.menu-main-logo { grid-column: 1 / 3; grid-row: 1; min-width: 0; }
.menu-main-over { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--haze); white-space: nowrap; }
.menu-main-over i { width: 22px; height: 1px; background: var(--haze); }
.menu-main-title { font-family: var(--f-display); font-size: clamp(34px, 5.5vw, 66px); font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; line-height: 1; margin-top: 5px; white-space: nowrap; text-shadow: 0 2px 20px var(--menu-ink); }
.menu-main-title::after { content: ""; display: block; width: min(330px, 80%); height: 2px; margin-top: 9px; background: linear-gradient(90deg, var(--dawn), var(--dawn-2) 40%, var(--menu-scrim-0)); }
.menu-main-nav { grid-column: 1; grid-row: 2; align-self: end; display: flex; flex-direction: column; min-width: 0; }
#ui .menu-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; color: var(--cream); }
.menu-nav-name { font-family: var(--f-display); font-size: 20px; font-weight: 500; letter-spacing: 0.17em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 1px 10px var(--menu-ink); }
.menu-nav-dots { flex: 1; min-width: 12px; align-self: flex-end; margin-bottom: 15px; border-bottom: 1px dotted var(--menu-cream-dim); opacity: 0.55; }
.menu-nav-note { max-width: 58%; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); font-size: 11px; color: var(--menu-cream-dim); white-space: nowrap; text-shadow: 0 1px 4px var(--night), 0 0 10px var(--night); }
.menu-nav-item:empty, .menu-nav-note:empty { display: none; }
#ui .menu-nav-item.is-primary { min-height: 52px; color: var(--dawn); }
.menu-nav-item.is-primary .menu-nav-name { font-size: 30px; font-weight: 600; }
.menu-nav-item.is-primary .menu-nav-note { color: var(--cream); font-size: 12px; }
.menu-nav-item.is-primary .menu-nav-dots { margin-bottom: 18px; border-bottom-color: var(--dawn); opacity: 0.5; }
#ui .menu-nav-item:active .menu-nav-name { transform: translateX(4px); }
.menu-nav-name { transition: transform 0.12s; }

.menu-main-side { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; }
#ui .menu-pilot { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 10px; padding: 11px 14px 12px; background: var(--menu-glass); border: 1px solid var(--glass-line); border-radius: 3px; color: var(--cream); }
.menu-pilot .menu-label { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-pilot-money { grid-column: 2; grid-row: 1 / 3; align-self: center; font-family: var(--f-mono); font-size: 19px; color: var(--dawn-2); white-space: nowrap; }
.menu-pilot-rank { grid-column: 1; font-family: var(--f-display); font-size: 18px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.15; }
.menu-pilot .menu-scale { grid-column: 1 / 3; margin-top: 8px; }
.menu-pilot-xp { grid-column: 1 / 3; margin-top: 5px; font-family: var(--f-mono); font-size: 10.5px; color: var(--haze); }
.menu-pilot-xp b { color: var(--cream); font-weight: 400; }
.menu-pilot-xp i { display: block; font-family: var(--f-body); font-size: 11px; margin-top: 1px; }
#ui .menu-daily { display: grid; gap: 1px; padding: 8px 14px 9px; min-height: 44px; border-left: 2px solid var(--dawn); background: var(--menu-glass); color: var(--cream); }
.menu-daily .menu-label { color: var(--dawn-2); }
.menu-daily-title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ui .menu-main-plane { display: grid; gap: 0; min-height: 44px; color: var(--cream); }
.menu-main-plane-name { font-family: var(--f-display); font-size: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.1; }
.menu-main-plane-sub { font-size: 11.5px; color: var(--menu-cream-dim); }
.menu-main-fs { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; }

@media (min-width: 1000px) and (min-height: 600px) {
  .menu { font-size: 15px; }
  :root { --menu-bar-h: 64px; }
  .menu-bar-title { font-size: 24px; }
  .menu-main { padding-top: calc(var(--sa-t) + 32px); padding-bottom: calc(var(--sa-b) + 30px); padding-left: calc(var(--sa-l) + 24px); padding-right: calc(var(--sa-r) + 12px); grid-template-columns: minmax(280px, 560px) minmax(0, 1fr) 320px; }
  #ui .menu-nav-item { min-height: 58px; }
  .menu-nav-name { font-size: 25px; }
  .menu-nav-item.is-primary .menu-nav-name { font-size: 40px; }
  #ui .menu-nav-item.is-primary { min-height: 72px; }
  .menu-nav-note { font-size: 12.5px; }
  .menu-rail { width: 220px; }
  #ui .menu-rail-tab { min-height: 52px; font-size: 15px; }
  .menu-body { padding-bottom: calc(var(--sa-b) + 22px); gap: 16px; }
}

@media (orientation: portrait) {
  .menu-screen--main::before { background: linear-gradient(180deg, var(--menu-scrim-3) 0, var(--menu-scrim-2) 45%, var(--menu-scrim-1) 100%); }
  .menu-main { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; touch-action: pan-y; padding-bottom: calc(var(--sa-b) + 70px); }
  .menu-main-nav { align-self: stretch; }
  .menu-main-fs { order: 9; flex: none; }
  .menu-main-over { white-space: normal; flex-wrap: wrap; gap: 2px 10px; }
  .menu-screen--hangar .menu-bar-title { display: none; }
  #ui .menu-bar .menu-seg button { padding: 0 9px; letter-spacing: 0.08em; }
  .menu-main-side { justify-content: flex-start; margin-top: auto; }
  .menu-body { flex-direction: column; }
  .menu-rail { flex-direction: row; width: auto; gap: 0; }
  #ui .menu-rail-tab { border-left: 0; border-bottom: 2px solid var(--menu-cream-faint); padding: 0 12px; background: none; }
  #ui .menu-rail-tab.is-on { border-bottom-color: var(--dawn); background: none; }
  .menu-bar-rank { display: none; }
  .menu-bar-back span { display: none; }
  .menu-bar-title { font-size: 17px; letter-spacing: 0.14em; }
}

/* src/ui/touch.css */
/* Сенсорное управление в полёте. Единица --u = 1px × масштаб интерфейса (--hs ставит ui/touch.js).
   Раскладка зеркалится для левши через direction: rtl + логические свойства (inset-inline-*). */
.touch {
  --hs: 1;
  --u: calc(var(--hs) * 1px);
  --touch-edge: rgba(244, 236, 216, 0.34);      /* кромка кнопок */
  --touch-fill: rgba(11, 22, 38, 0.5);          /* стекло кнопок */
  --touch-fill-on: rgba(255, 154, 61, 0.26);    /* нажатая/активная кнопка */
  --touch-knob-2: #d9cfb6;                      /* нижний край рукоятки РУД */
  font-family: var(--f-display);
  color: var(--cream);
  direction: ltr;
}
.touch.touch-lefty { direction: rtl; }
.touch[hidden], .touch [hidden] { display: none !important; }
.touch button, .touch-thr-val, .touch-thr-handle { direction: ltr; }
.touch-hint, .touch-thr-ab span { unicode-bidi: plaintext; text-align: left; }
.touch svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* ---------- ручка ---------- */
.touch-zone {
  position: absolute; inset-inline-start: 0; bottom: 0;
  top: calc(var(--sa-t) + 112 * var(--u)); width: 31%; min-width: calc(200 * var(--u));
  pointer-events: auto; touch-action: none;
}
.touch-stick { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0.5; transition: transform 0.22s ease-out, opacity 0.2s; will-change: transform; }
.touch-stick.is-active { opacity: 1; transition: opacity 0.1s; }
.touch-stick-base {
  position: absolute; left: calc(-58 * var(--u)); top: calc(-58 * var(--u));
  width: calc(116 * var(--u)); height: calc(116 * var(--u)); border-radius: 50%; box-sizing: border-box;
  border: 1.5px solid var(--touch-edge);
  background: radial-gradient(circle, rgba(11, 22, 38, 0.1) 0 46%, var(--touch-fill) 100%);
}
.touch-stick-base i { position: absolute; left: 50%; top: 50%; width: calc(8 * var(--u)); height: 1.5px; margin: -1px 0 0 calc(-4 * var(--u)); background: var(--cream); opacity: 0.7; }
.touch-stick-base i:nth-child(1) { transform: translateY(calc(-50 * var(--u))) rotate(90deg); }
.touch-stick-base i:nth-child(2) { transform: translateY(calc(50 * var(--u))) rotate(90deg); }
.touch-stick-base i:nth-child(3) { transform: translateX(calc(-50 * var(--u))); }
.touch-stick-base i:nth-child(4) { transform: translateX(calc(50 * var(--u))); }
.touch-stick-knob {
  position: absolute; left: calc(-27 * var(--u)); top: calc(-27 * var(--u));
  width: calc(54 * var(--u)); height: calc(54 * var(--u)); border-radius: 50%; box-sizing: border-box;
  border: 1.5px solid var(--cream);
  background: radial-gradient(circle at 50% 38%, var(--night-3), var(--night) 78%);
  box-shadow: 0 calc(3 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.45), inset 0 0 0 calc(7 * var(--u)) rgba(244, 236, 216, 0.07);
  transition: transform 0.14s ease-out; will-change: transform;
}
.touch-stick.is-active .touch-stick-knob { transition: none; border-color: var(--dawn-2); }

/* ---------- РУД ---------- */
.touch-thr {
  --t: 0; --a: 0; --ab: 0.12; --hh: calc(38 * var(--u));
  position: absolute; inset-inline-end: calc(var(--sa-r) - 8 * var(--u));
  bottom: calc(var(--sa-b) + 6 * var(--u));
  width: calc(72 * var(--u));
  height: min(calc(282 * var(--u)), calc(100% - var(--sa-t) - var(--sa-b) - 66 * var(--u)));
  display: flex; flex-direction: column; align-items: center; gap: calc(3 * var(--u));
  pointer-events: auto; touch-action: none;
}
.touch-thr-track {
  position: relative; flex: 1; width: calc(44 * var(--u)); box-sizing: border-box;
  border-radius: calc(12 * var(--u)); border: 1.5px solid var(--touch-edge); background: var(--touch-fill);
}
.touch-thr-scale {
  position: absolute; inset-inline-end: calc(5 * var(--u)); width: calc(7 * var(--u));
  top: calc(var(--hh) / 2); bottom: calc(var(--hh) / 2 - 1px);
  background: repeating-linear-gradient(to top, var(--touch-edge) 0 1px, transparent 1px 10%);
}
.touch-thr-ab {
  position: absolute; left: 0; right: 0; top: 0; height: calc(var(--ab) * (100% - var(--hh)) + var(--hh) / 2);
  border-radius: calc(11 * var(--u)) calc(11 * var(--u)) 0 0; border-bottom: 1.5px solid var(--dawn);
  background: repeating-linear-gradient(-45deg, rgba(255, 154, 61, 0.34) 0 calc(4 * var(--u)), rgba(255, 154, 61, 0.1) calc(4 * var(--u)) calc(8 * var(--u)));
}
.touch-thr-ab span { position: absolute; inset-inline-end: calc(100% + 5 * var(--u)); top: calc(4 * var(--u)); font-size: calc(9 * var(--u)); letter-spacing: 0.12em; color: var(--dawn-2); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); white-space: nowrap; }
.touch-thr-fill {
  position: absolute; left: calc(50% - 3 * var(--u)); width: calc(6 * var(--u)); border-radius: calc(3 * var(--u));
  bottom: calc(var(--hh) / 2); height: calc(var(--t) * (100% - var(--hh)));
  background: linear-gradient(to top, var(--dawn), var(--dawn-2));
}
.touch-thr-real { position: absolute; inset-inline-start: calc(4 * var(--u)); width: calc(7 * var(--u)); height: 2px; bottom: calc(var(--hh) / 2 + var(--a) * (100% - var(--hh)) - 1px); background: var(--cream); border-radius: 1px; }
.touch-thr-handle {
  position: absolute; left: calc(-7 * var(--u)); right: calc(-7 * var(--u)); height: var(--hh); box-sizing: border-box;
  bottom: calc(var(--t) * (100% - var(--hh)));
  border-radius: calc(9 * var(--u)); background: linear-gradient(to bottom, var(--cream), var(--touch-knob-2));
  box-shadow: 0 calc(3 * var(--u)) calc(9 * var(--u)) rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(11, 22, 38, 0.18);
  display: flex; align-items: center; justify-content: center;
  color: var(--night); font-size: calc(12 * var(--u)); letter-spacing: 0.14em;
}
.touch-thr-handle b { font-weight: 600; }
.touch-thr.is-down .touch-thr-handle { box-shadow: 0 0 0 calc(3 * var(--u)) rgba(255, 197, 107, 0.45), 0 calc(3 * var(--u)) calc(9 * var(--u)) rgba(0, 0, 0, 0.5); }
.touch-thr.is-ab .touch-thr-handle { background: linear-gradient(to bottom, var(--dawn-2), var(--dawn)); }
.touch-thr-val { font-family: var(--f-mono); font-size: calc(12 * var(--u)); font-weight: 600; line-height: 1.1; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }

/* ---------- кнопки под правым большим пальцем ---------- */
.touch-cluster {
  position: absolute; inset-inline-end: calc(var(--sa-r) + 62 * var(--u)); bottom: calc(var(--sa-b) + 10 * var(--u));
  display: grid; grid-template-columns: repeat(2, calc(60 * var(--u))); grid-auto-rows: auto;
  gap: calc(8 * var(--u)); align-content: end;
}
.touch-btn {
  position: relative; width: calc(60 * var(--u)); height: calc(60 * var(--u)); padding: 0; margin: 0; box-sizing: border-box;
  border-radius: 50%; border: 1.5px solid var(--touch-edge); background: var(--touch-fill);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(1 * var(--u));
  pointer-events: auto; touch-action: none !important; cursor: pointer;
  transition: transform 0.08s, background 0.12s, border-color 0.12s;
}
.touch-btn.is-down { transform: scale(0.93); background: var(--touch-fill-on); border-color: var(--dawn-2); }
.touch-lbl { font-size: calc(8.5 * var(--u)); letter-spacing: 0.1em; line-height: 1; opacity: 0.92; white-space: nowrap; }
.touch-cap { font-family: var(--f-mono); font-size: calc(9 * var(--u)); font-weight: 600; line-height: 1; color: var(--dawn-2); white-space: nowrap; }
.touch-b-action { grid-column: 1 / 3; grid-row: 1; width: 100%; height: calc(46 * var(--u)); border-radius: calc(23 * var(--u)); flex-direction: row; gap: calc(6 * var(--u)); background: var(--dawn); border-color: var(--dawn-2); color: var(--night); padding: 0 calc(8 * var(--u)); }
.touch-b-action .touch-lbl { font-size: calc(12 * var(--u)); font-weight: 600; white-space: normal; text-align: start; opacity: 1; }
.touch-b-action.is-down { background: var(--dawn-2); }
.touch-b-wsel { grid-column: 1; grid-row: 2; }
.touch-b-launch { grid-column: 2; grid-row: 2; border-color: var(--dawn); }
.touch-b-gear { grid-column: 1; grid-row: 3; }
.touch-b-fire { grid-column: 2; grid-row: 3; border-color: var(--signal); }
.touch-b-fire svg { stroke: var(--signal); }
.touch-b-flaps { grid-column: 1; grid-row: 4; }
.touch-b-brake { grid-column: 2; grid-row: 4; }
.touch-b-brake.is-on { border-color: var(--dawn); }
.touch-btn.is-empty { opacity: 0.5; }
.touch-btn.is-empty .touch-cap { color: var(--signal); }
.touch-lamps { display: flex; gap: calc(3 * var(--u)); height: calc(5 * var(--u)); }
.touch-lamps i { width: calc(5 * var(--u)); height: calc(5 * var(--u)); border-radius: 50%; background: var(--night-3); box-shadow: inset 0 0 0 1px var(--touch-edge); }
.touch-b-gear.is-on .touch-lamps i { background: var(--ok); box-shadow: 0 0 calc(5 * var(--u)) var(--ok); }
.touch-b-gear.is-move .touch-lamps i { background: var(--dawn); animation: touch-blink 0.5s steps(2) infinite; }
.touch-pips i { width: calc(11 * var(--u)); height: calc(4 * var(--u)); border-radius: calc(2 * var(--u)); }
.touch-b-flaps.is-f1 .touch-pips i:first-child, .touch-b-flaps.is-f2 .touch-pips i { background: var(--dawn-2); box-shadow: 0 0 calc(5 * var(--u)) var(--dawn); }
.touch-btn.is-hint { border-color: var(--dawn-2); animation: touch-pulse 1.1s ease-in-out infinite; }

/* ---------- верхние мелкие кнопки ---------- */
.touch-top { position: absolute; top: calc(var(--sa-t) + 8 * var(--u)); inset-inline-end: var(--sa-r); display: flex; gap: calc(6 * var(--u)); }
.touch-mini {
  width: calc(44 * var(--u)); height: calc(44 * var(--u)); min-width: 44px; min-height: 44px; padding: 0; box-sizing: border-box;
  border-radius: calc(11 * var(--u)); border: 1px solid var(--glass-line); background: var(--touch-fill);
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto; touch-action: none !important; cursor: pointer;
}
.touch-mini svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
.touch-mini.is-down { background: var(--touch-fill-on); border-color: var(--dawn-2); }
.touch-m-time span { font-family: var(--f-mono); font-size: calc(14 * var(--u)); font-weight: 600; }
.touch-m-time.is-on { border-color: var(--dawn); color: var(--dawn-2); }

/* ---------- подсказки первого полёта ---------- */
.touch-hint {
  position: absolute; max-width: calc(190 * var(--u)); box-sizing: border-box;
  font-family: var(--f-body); font-size: calc(11.5 * var(--u)); line-height: 1.25; color: var(--cream);
  background: var(--glass); border: 1px solid var(--dawn); border-radius: calc(9 * var(--u)); padding: calc(6 * var(--u)) calc(10 * var(--u));
  animation: touch-float 2.2s ease-in-out infinite;
}
.touch-hint b { display: block; font-family: var(--f-display); font-weight: 600; letter-spacing: 0.14em; color: var(--dawn-2); font-size: calc(11 * var(--u)); }
